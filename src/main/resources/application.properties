spring.application.name=airline-reservation

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/airline_reservation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Piyush
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# MongoDB Configuration
# ==========================================
spring.data.mongodb.uri=mongodb://localhost:27017/airline_logs
spring.data.mongodb.auto-index-creation=true

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET:7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
